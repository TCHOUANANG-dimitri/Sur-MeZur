# Sur-MeZur — API en HTTPS sur api.sur-mezur.com (site web heberge sur o2switch).
#
# Le site (o2switch) relaie /api/* vers https://api.sur-mezur.com : les mots
# de passe et les sessions ne circulent plus en clair entre les deux serveurs.
# Ce bloc s'ajoute aux autres sites de nginx (ports 80/443) sans les toucher ;
# le port 8080 (nginx-surmezur.conf) reste ouvert tant que Vercel l'utilise.
#
# Installation (DNS api.sur-mezur.com -> 169.58.69.36 deja en place) :
#   sudo cp /srv/surmezur/app/deploy/contabo/nginx-api-https.conf /etc/nginx/sites-available/surmezur-api
#   sudo ln -sf /etc/nginx/sites-available/surmezur-api /etc/nginx/sites-enabled/surmezur-api
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.sur-mezur.com --redirect
# certbot ajoute lui-meme l'ecoute 443 et le certificat dans ce fichier.

server {
    listen 80;
    listen [::]:80;
    server_name api.sur-mezur.com;

    # Deux photos de mesure par envoi, deja reduites cote navigateur.
    client_max_body_size 30m;
    server_tokens off;

    # Webhook de paiement : ferme tant que le vrai fournisseur Mobile Money
    # n'est pas branche (les paiements sont desactives dans la plateforme).
    location = /api/payments/webhook {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Le site o2switch transmet deja l'IP du visiteur en tete de
        # X-Forwarded-For ; nginx y ajoute celle d'o2switch a la suite.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une analyse de mesure peut prendre plus d'une minute a froid.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    access_log /var/log/nginx/surmezur-api.access.log;
    error_log /var/log/nginx/surmezur-api.error.log;
}
