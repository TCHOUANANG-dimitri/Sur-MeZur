# Sur-MeZur — API derriere nginx, sur le port 8080.
#
# Le VPS heberge deja d'autres sites dans nginx sur les ports 80/443 : on ne
# desactive PAS nginx, on lui ajoute ce site sur un port dedie. Vercel (site
# web et collecte) joint l'API via API_ORIGIN=http://169.58.69.36:8080.
#
# Installation :
#   sudo cp /srv/surmezur/app/deploy/contabo/nginx-surmezur.conf /etc/nginx/sites-available/surmezur
#   sudo ln -sf /etc/nginx/sites-available/surmezur /etc/nginx/sites-enabled/surmezur
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 8080/tcp

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Deux photos de mesure par envoi, deja reduites cote navigateur.
    client_max_body_size 30m;
    server_tokens off;

    # Webhook de paiement : ferme tant que le vrai fournisseur Mobile Money
    # n'est pas branche (les paiements sont desactives dans la plateforme).
    location = /api/payments/webhook {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une analyse de mesure peut prendre plus d'une minute a froid.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    access_log /var/log/nginx/surmezur.access.log;
    error_log /var/log/nginx/surmezur.error.log;
}
